
name: Import ZIP Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: combined-version

      - name: Extract project ZIP
        run: |
          unzip -q Ansary-New-Version.zip -d /tmp/new-project

          ROOT=/tmp/new-project
          COUNT=$(find /tmp/new-project -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$COUNT" -eq 1 ]; then
            FIRST=$(find /tmp/new-project -mindepth 1 -maxdepth 1)
            if [ -d "$FIRST" ]; then
              ROOT="$FIRST"
            fi
          fi

          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a "$ROOT"/. .
          rm -f Ansary-New-Version.zip

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import combined ANSARY project" || echo "No changes"
          git push origin HEAD:combined-version
