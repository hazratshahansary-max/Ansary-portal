name: Test ANSARY Website Build

on:
workflow_dispatch:
push:
branches:
- combined-version

permissions:
contents: write

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout project
    uses: actions/checkout@v4
    with:
      ref: combined-version

  - name: Setup Bun
    uses: oven-sh/setup-bun@v2

  - name: Install dependencies and update lockfile
    run: bun install

  - name: Build website
    run: bun run build

  - name: Save updated lockfile
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add bun.lock
      git commit -m "Update bun lockfile" || echo "No changes"
      git push origin HEAD:combined-version
